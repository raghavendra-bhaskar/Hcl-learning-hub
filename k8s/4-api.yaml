# ── Express / Prisma API backend — Deployment + PVC + Service ────────────────
# Image is built from server/Dockerfile.
# Build & push before applying:
#   docker build -t ghcr.io/raghavendra-bhaskar/hcl-learning-hub-api:latest ./server
#   docker push  ghcr.io/raghavendra-bhaskar/hcl-learning-hub-api:latest

apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: api-data-pvc
  namespace: hcl-learning-hub
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  namespace: hcl-learning-hub
  labels:
    app: api
spec:
  replicas: 1
  selector:
    matchLabels:
      app: api
  template:
    metadata:
      labels:
        app: api
    spec:
      containers:
        - name: api
          image: ghcr.io/raghavendra-bhaskar/hcl-learning-hub-api:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 4000
          env:
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: hcl-learning-hub-secrets
                  key: db-password
            - name: DATABASE_URL
              value: "postgresql://hcl_hub:$(DB_PASSWORD)@postgres:5432/hcl_learning_hub"
            - name: NODE_ENV
              valueFrom:
                configMapKeyRef:
                  name: hcl-learning-hub-config
                  key: NODE_ENV
            - name: PORT
              valueFrom:
                configMapKeyRef:
                  name: hcl-learning-hub-config
                  key: PORT
            - name: ENABLE_LOCAL_ADMIN
              valueFrom:
                configMapKeyRef:
                  name: hcl-learning-hub-config
                  key: ENABLE_LOCAL_ADMIN
            - name: LOCAL_ADMIN_USERNAME
              valueFrom:
                configMapKeyRef:
                  name: hcl-learning-hub-config
                  key: ADMIN_USERNAME
            - name: LOCAL_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: hcl-learning-hub-secrets
                  key: admin-password
            - name: LOCAL_ADMIN_JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: hcl-learning-hub-secrets
                  key: jwt-secret
            # Browser-facing origin for CORS (set to the Ingress host)
            - name: FRONTEND_ORIGIN
              value: "http://hcl-learning-hub.hcl-software.com"
          volumeMounts:
            - name: api-data
              mountPath: /app/data
          readinessProbe:
            httpGet:
              path: /health
              port: 4000
            initialDelaySeconds: 20
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 4000
            initialDelaySeconds: 30
            periodSeconds: 30
          resources:
            requests:
              cpu: 200m
              memory: 256Mi
            limits:
              cpu: 1000m
              memory: 512Mi
      volumes:
        - name: api-data
          persistentVolumeClaim:
            claimName: api-data-pvc

---
apiVersion: v1
kind: Service
metadata:
  name: api
  namespace: hcl-learning-hub
spec:
  selector:
    app: api
  ports:
    - port: 4000
      targetPort: 4000

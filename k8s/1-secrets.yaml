# ── HCL Software Learning Hub — Secrets ──────────────────────────────────────
# Fill in real values, then apply:
#   kubectl apply -f k8s/1-secrets.yaml
#
# Generate secrets:
#   openssl rand -hex 24   ← for db-password
#   openssl rand -hex 32   ← for jwt-secret
#
# NEVER commit this file with real values.
# The template (with placeholders) is safe to commit.

apiVersion: v1
kind: Secret
metadata:
  name: hcl-learning-hub-secrets
  namespace: hcl-learning-hub
type: Opaque
stringData:
  db-password:    "CHANGE_ME_strong_db_password"
  jwt-secret:     "CHANGE_ME_64_char_random_hex_string"
  admin-password: "Admin@HCL2026!"

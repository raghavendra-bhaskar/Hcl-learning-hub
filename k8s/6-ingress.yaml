# ── Ingress — routes external traffic to web (frontend) ───────────────────────
# This production manifest uses k3s' bundled Traefik Ingress controller.
# Create the hcl-hub-tls Secret in this namespace before applying this Ingress.

apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: hcl-learning-hub
  namespace: hcl-learning-hub
spec:
  ingressClassName: traefik
  tls:
    - hosts:
        - hclswl2learninghub.prod.hclpnp.com
        - hclswl2learninghub
      secretName: hcl-hub-tls
  rules:
    - host: hclswl2learninghub.prod.hclpnp.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: web
                port:
                  number: 80
    - host: hclswl2learninghub
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: web
                port:
                  number: 80
